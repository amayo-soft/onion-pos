name: Clang-Tidy Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, window, dev]

jobs:
  clang-tidy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install CMake
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tidy cmake

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          aqtversion: "==3.3.*"
          version: "6.12.0"
          host: "linux"
          target: "desktop"
          arch: "linux_gcc_64"

      - name: Configure CMake
        run: |
          cmake -B build -S . -G "Ninja"

      - name: Run Clang-Tidy Review
        uses: T-im4i-k/clang-tidy-check@v3.2.0
        with:
          version: "20"
          compile-commands-path: './build/compile_commands.json'
          file-exclude-regex: '/build/|/third_party/|/out/|/extern/|/external/|/3rdparty/'
          config-file: './.clang-tidy'
          
