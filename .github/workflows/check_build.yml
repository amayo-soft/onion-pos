name: Check Build

on:
  push:
    branches: [ "dev", "main", "window" ]
  pull_request:
    branches: [ "main" ]

jobs:

  prepare:

    runs-on: ubuntu-latest

    steps: # setup repo
    - uses: actions/checkout@v4
      with:
        submodules: true
        fetch-depth: 2

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        aqtversion: '==3.3.*'
        version: '6.12.0'
        host: 'linux'
        target: 'desktop'
        arch: 'linux_gcc_64'
        
    - uses: threeal/cmake-action@v2.1.0
      with:
        generator: Ninja
        cxx-compiler: clang++
        source-dir: .
        build-dir: build
  
